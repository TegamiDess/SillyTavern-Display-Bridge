<!doctype html><meta charset="utf-8"><title>Large asset editor benchmark</title>
<link rel="stylesheet" href="/extension/style.css">
<style>body{font:16px system-ui;background:#202630;color:#e7edf7;margin:24px}#editor{max-width:900px}button{padding:10px}</style>
<h1>Large asset editor benchmark</h1>
<p>Neutral data: 1,111 asset names, four portraits, six outfits. No image files are loaded. Measures synchronous editor creation plus one forced layout; not whole-app scrolling or peak memory.</p>
<button id="run">Run benchmark</button><pre id="results">Not run</pre><div id="editor"></div>
<script type="module">
import {createPresetEditor} from '/extension/components/preset-editor.js';
import {DEFAULT_PRESET} from '/extension/adapters/portrait-dialogue.js';
const names=Array.from({length:1111},(_,i)=>'asset-'+i);
window.v3sprites={api:{apiVersion:1,listImages:()=>({status:'available',images:names.map(name=>({name}))}),resolveImage:()=>({status:'missing'})}};
const variants=Array.from({length:6},(_,i)=>({id:'outfit-'+i,label:'Outfit '+i,images:Object.fromEntries(Array.from({length:4},(_,j)=>['asset-'+j,'asset-'+(4+i*4+j)]))}));
const source={...DEFAULT_PRESET,variants},mount=document.getElementById('editor'),results=document.getElementById('results');
document.getElementById('run').addEventListener('click',async()=>{
    const times=[];let counts;
    document.getElementById('run').disabled=true;
    try {
        for(let i=0;i<6;i++){
            mount.replaceChildren();await new Promise(requestAnimationFrame);
            const start=performance.now();
            const editor=createPresetEditor({source,avatar:'benchmark.png',sample:'[Scene|speaker:Alex|text:Welcome|image:asset-0]',review(){},close(){mount.replaceChildren();}});
            mount.append(editor);editor.getBoundingClientRect();
            if(i>0)times.push(performance.now()-start);
            counts={suggestionLists:editor.querySelectorAll('datalist').length,suggestionEntries:editor.querySelectorAll('datalist option').length,closedOutfitRows:editor.querySelectorAll('.db-appearance-option .db-mapping-row').length,elements:editor.querySelectorAll('*').length};
        }
        const sorted=[...times].sort((a,b)=>a-b);
        results.textContent=JSON.stringify({...counts,medianMs:Math.round(sorted[2]*100)/100,runsMs:times.map(n=>Math.round(n*100)/100)},null,2);
    } finally {document.getElementById('run').disabled=false;}
});
</script>
